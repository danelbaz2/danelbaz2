  <text x="50" y="27.5" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E8ECF6">Job Hunter, live</text>
