<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">Dan Elbaz, backend development</title>
  <desc id="d">A search for a backend developer in the Central District. Three results about Dan's work at Elbit are retrieved, reranked, and an answer is written from them: Dan Elbaz, backend developer, Python, Java, MongoDB, RAG, Petah Tikva.</desc>
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#1B2550"/>
      <stop offset="1" stop-color="#080B16"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="row0"><rect x="56" y="160" width="660" height="68" rx="10"/></clipPath>
    <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CD6E0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5CD6E0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5CD6E0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.4" stop-color="#FFB547"/>
      <stop offset="0.5" stop-color="#FFF1D6"/>
      <stop offset="0.6" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FFB547"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;460 0;460 0" keyTimes="0;.5;1" dur="6s" begin="11s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur6" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="1280" height="480" rx="20"/></clipPath>
    <clipPath id="typeQ"><rect class="typeQ" x="96" y="56" width="600" height="40"/></clipPath>
    <clipPath id="ans1"><rect class="ans a1" x="820" y="242" width="400" height="30"/></clipPath>
    <clipPath id="ans2"><rect class="ans a2" x="820" y="274" width="400" height="30"/></clipPath>
    <clipPath id="ans3"><rect class="ans a3" x="820" y="306" width="400" height="30"/></clipPath>
    <clipPath id="ans4"><rect class="ans a4" x="820" y="338" width="420" height="30"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

      /* 12s loop: type, retrieve, rerank, answer */
      .typeQ { animation: typeQ 12s steps(44) 1 forwards; }
      @keyframes typeQ { 0% { width: 0 } 15%,100% { width: 600px } }

      .row { opacity: 0; animation-duration: 12s; animation-iteration-count: 1; animation-fill-mode: forwards; animation-timing-function: cubic-bezier(.6,0,.2,1); }
      .rowA { animation-name: rowA; } .rowB { animation-name: rowB; } .rowC { animation-name: rowC; }
      @keyframes rowA { 0%,19% { opacity: 0; transform: translate(0,80px) } 22% { opacity: 1; transform: translate(0,80px) } 40% { transform: translate(0,80px) } 48%,100% { opacity: 1; transform: translate(0,0) } }
      @keyframes rowB { 0%,21% { opacity: 0; transform: translate(0,160px) } 24% { opacity: 1; transform: translate(0,160px) } 40% { transform: translate(0,160px) } 48%,100% { opacity: 1; transform: translate(0,80px) } }
      @keyframes rowC { 0%,17% { opacity: 0; transform: translate(0,0) } 20% { opacity: 1; transform: translate(0,0) } 40% { transform: translate(0,0) } 48%,100% { opacity: 1; transform: translate(0,160px) } }

      .s0 { animation: s0 12s 1 forwards; } .s1 { opacity: 0; animation: s1 12s 1 forwards; }
      @keyframes s0 { 0%,40% { opacity: 1 } 44%,100% { opacity: 0 } }
      @keyframes s1 { 0%,42% { opacity: 0 } 47%,100% { opacity: 1 } }
      .bar { transform-box: fill-box; transform-origin: left center; }
      .bA { animation: bA 12s 1 forwards; } .bB { animation: bB 12s 1 forwards; } .bC { animation: bC 12s 1 forwards; }
      @keyframes bA { 0%,40% { transform: scaleX(.71) } 48%,100% { transform: scaleX(.91) } }
      @keyframes bB { 0%,40% { transform: scaleX(.69) } 48%,100% { transform: scaleX(.87) } }
      @keyframes bC { 0%,40% { transform: scaleX(.74) } 48%,100% { transform: scaleX(.82) } }

      .stage { opacity: .35; animation: stage 12s 1 forwards; }
      .st2 { animation-name: stage2 } .st3 { animation-name: stage3 }
      @keyframes stage  { 0%,2% { opacity: .35 } 4%,17% { opacity: 1 } 19%,100% { opacity: .35 } }
      @keyframes stage2 { 0%,38% { opacity: .35 } 40%,48% { opacity: 1 } 50%,100% { opacity: .35 } }
      @keyframes stage3 { 0%,50% { opacity: .35 } 52%,100% { opacity: 1 } }

      .ans { width: 0; }
      .a1 { animation: a1 12s steps(30) 1 forwards; } .a2 { animation: a2 12s steps(30) 1 forwards; } .a3 { animation: a3 12s steps(30) 1 forwards; } .a4 { animation: a4 12s steps(30) 1 forwards; }
      @keyframes a1 { 0%,51% { width: 0 } 60%,100% { width: 400px } }
      @keyframes a2 { 0%,58% { width: 0 } 67%,100% { width: 400px } }
      @keyframes a3 { 0%,65% { width: 0 } 74%,100% { width: 400px } }
      @keyframes a4 { 0%,72% { width: 0 } 81%,100% { width: 400px } }

      .src { opacity: .25; animation: src 12s 1 forwards; }
      .src2 { animation-delay: .9s } .src3 { animation-delay: 1.8s }
      @keyframes src { 0%,51% { opacity: .25 } 55%,100% { opacity: 1 } }

      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .drift { animation: drift 16s ease-in-out infinite; }
      .dr2 { animation-delay: -6s } .dr3 { animation-delay: -11s }
      @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(14px,-10px) } }


      /* continuous motion after the intro */
      .caretWrap { opacity: 0; animation: fadeIn .3s ease 1.9s forwards; }
      @keyframes fadeIn { to { opacity: 1 } }
      .caret2 { animation: cblink 1.05s steps(1) infinite; }
      @keyframes cblink { 50% { fill-opacity: 0 } }
      .shine { transform: translateX(-260px); animation: shine 10s ease-in-out 11s infinite; }
      @keyframes shine { 0% { transform: translateX(-260px) } 60%,100% { transform: translateX(760px) } }
      .edge { opacity: 0; animation: edge 9s 1 forwards, glow 4s ease-in-out 10s infinite; }
      @keyframes edge { 0%,90% { opacity: 0 } 100% { opacity: .25 } }
      @keyframes glow { 0%,100% { opacity: .25 } 50% { opacity: .8 } }
      .ln { stroke-opacity: 0; animation: ln 7s ease-in-out infinite; }
      .ln2 { animation-delay: -1.5s } .ln3 { animation-delay: -3s } .ln4 { animation-delay: -4.5s } .ln5 { animation-delay: -6s }
      @keyframes ln { 0%,100% { stroke-opacity: 0 } 40%,60% { stroke-opacity: .35 } }
      .tw { animation: tw 5s ease-in-out infinite; }
      .tw2 { animation-delay: -2s } .tw3 { animation-delay: -3.5s }
      @keyframes tw { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
      @media (prefers-reduced-motion: reduce) {
        .caretWrap, .caret2, .shine, .edge, .ln, .tw { animation: none; } .caretWrap { opacity: 1 } .edge { opacity: .25 } .shine { opacity: 0 }
        .typeQ, .row, .s0, .s1, .bar, .stage, .ans, .src, .caret, .drift { animation: none; }
        .typeQ { width: 600px } .row { opacity: 1 } .s0 { opacity: 0 } .s1 { opacity: 1 }
        .rowA { transform: translate(0,0) } .rowB { transform: translate(0,80px) } .rowC { transform: translate(0,160px) }
        .bA { transform: scaleX(.91) } .bB { transform: scaleX(.87) } .bC { transform: scaleX(.82) }
        .ans { width: 420px } .src { opacity: 1 } .stage { opacity: 1 }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="url(#glow)"/>
    <rect width="1280" height="480" fill="url(#dots)"/>

    <!-- query bar -->
    <rect x="56" y="52" width="660" height="52" rx="12" fill="#0D1326" stroke="#26315A" stroke-width="1.5"/>
    <g stroke="#5CD6E0" stroke-width="2.2" fill="none" stroke-linecap="round">
      <circle cx="80" cy="76" r="7"/><path d="M85 81 l6 6"/>
    </g>
    <text x="102" y="83" class="mono" font-size="18" fill="#E8ECF6" clip-path="url(#typeQ)">backend developer, python, central district<tspan class="caret2" fill="#5CD6E0" dx="3">▌</tspan></text>

    <!-- pipeline stages -->
    <g class="mono" font-size="15">
      <text class="stage" x="56" y="140" fill="#5CD6E0">retrieve</text>
      <text x="140" y="140" fill="#3A4670">/</text>
      <text class="stage st2" x="158" y="140" fill="#FFB547">rerank</text>
      <text x="222" y="140" fill="#3A4670">/</text>
      <text class="stage st3" x="240" y="140" fill="#E8ECF6">answer</text>
    </g>

    <!-- results: three rows that get reordered -->
    <g transform="translate(56 160)">
      <!-- A: RAG pipeline (retrieved 2nd, reranked to 1st) -->
      <g class="row rowA">
        <rect width="660" height="68" rx="10" fill="#0D1326" stroke="#1E2748"/>
        <text x="20" y="30" class="mono" font-size="15" fill="#E8ECF6"><tspan class="s0">0.71</tspan></text>
        <text x="20" y="30" class="mono" font-size="15" fill="#FFB547"><tspan class="s1">0.91</tspan></text>
        <rect x="20" y="42" width="52" height="3" rx="1.5" fill="#1E2748"/>
        <rect class="bar bA" x="20" y="42" width="52" height="3" rx="1.5" fill="#FFB547"/>
        <text x="96" y="30" class="sans" font-size="17" fill="#E8ECF6">Built the <tspan fill="#5CD6E0">RAG pipeline</tspan> of an AI incident platform</text>
        <text x="96" y="52" class="sans" font-size="15" fill="#8995B6">[1] Elbit Systems, 2026</text>
      </g>
      <!-- B: HD Manager (retrieved 3rd, reranked to 2nd) -->
      <g class="row rowB">
        <rect width="660" height="68" rx="10" fill="#0D1326" stroke="#1E2748"/>
        <text x="20" y="30" class="mono" font-size="15" fill="#E8ECF6"><tspan class="s0">0.69</tspan></text>
        <text x="20" y="30" class="mono" font-size="15" fill="#FFB547"><tspan class="s1">0.87</tspan></text>
        <rect x="20" y="42" width="52" height="3" rx="1.5" fill="#1E2748"/>
        <rect class="bar bB" x="20" y="42" width="52" height="3" rx="1.5" fill="#FFB547"/>
        <text x="96" y="30" class="sans" font-size="17" fill="#E8ECF6">Designed a <tspan fill="#5CD6E0">real-time CRM</tspan> in Flask and MongoDB, in production</text>
        <text x="96" y="52" class="sans" font-size="15" fill="#8995B6">[2] HD Manager, Elbit Systems</text>
      </g>
      <!-- C: incidents (retrieved 1st, reranked to 3rd) -->
      <g class="row rowC">
        <rect width="660" height="68" rx="10" fill="#0D1326" stroke="#1E2748"/>
        <text x="20" y="30" class="mono" font-size="15" fill="#E8ECF6"><tspan class="s0">0.74</tspan></text>
        <text x="20" y="30" class="mono" font-size="15" fill="#FFB547"><tspan class="s1">0.82</tspan></text>
        <rect x="20" y="42" width="52" height="3" rx="1.5" fill="#1E2748"/>
        <rect class="bar bC" x="20" y="42" width="52" height="3" rx="1.5" fill="#FFB547"/>
        <text x="96" y="30" class="sans" font-size="17" fill="#E8ECF6">Fixes <tspan fill="#5CD6E0">production incidents</tspan> in Java and Python services</text>
        <text x="96" y="52" class="sans" font-size="15" fill="#8995B6">[3] Tier 3 support, Elbit Systems</text>
      </g>
    </g>

    <g clip-path="url(#row0)"><rect class="shine" x="56" y="160" width="240" height="68" fill="url(#shineG)"/></g>

    <!-- answer panel -->
    <g>
      <rect class="edge" x="776" y="52" width="448" height="376" rx="16" fill="none" stroke="#5CD6E0" stroke-width="3" filter="url(#blur6)"/>
      <rect x="776" y="52" width="448" height="376" rx="16" fill="#0B1022" fill-opacity=".85" stroke="#26315A" stroke-width="1.5"/>
      <rect class="edge" x="776" y="52" width="448" height="376" rx="16" fill="none" stroke="#5CD6E0" stroke-width="1"/>
      <text x="820" y="148" class="sans" font-size="58" font-weight="800" fill="#F2F4FA" letter-spacing="-2">Dan Elbaz</text>
      <rect x="820" y="172" width="48" height="4" rx="2" fill="#5CD6E0"/>
      <rect x="872" y="172" width="20" height="4" rx="2" fill="#FFB547"/>

      <text x="820" y="218" class="sans" font-size="22" font-weight="600" fill="#C3CBE0">Backend development</text>
      <g class="sans" font-size="19" fill="#A7B1CC">
        <text x="820" y="296" clip-path="url(#ans2)">4 years at Elbit Systems.</text>
        <text x="820" y="328" clip-path="url(#ans3)">Python, Java, MongoDB, RAG.</text>
        <text x="820" y="360" clip-path="url(#ans4)">Petah Tikva, Central District.</text>
        <text x="820" y="264" clip-path="url(#ans1)" fill="url(#shimmer)" font-weight="600">Seeking a backend role.</text>
      </g>

      <g class="mono" font-size="13">
        <rect class="src" x="820" y="384" width="34" height="26" rx="6" fill="#141B36" stroke="#5CD6E0"/><text class="src" x="837" y="402" text-anchor="middle" fill="#5CD6E0">[1]</text>
        <rect class="src src2" x="862" y="384" width="34" height="26" rx="6" fill="#141B36" stroke="#5CD6E0"/><text class="src src2" x="879" y="402" text-anchor="middle" fill="#5CD6E0">[2]</text>
        <rect class="src src3" x="904" y="384" width="34" height="26" rx="6" fill="#141B36" stroke="#5CD6E0"/><text class="src src3" x="921" y="402" text-anchor="middle" fill="#5CD6E0">[3]</text>
        <text x="954" y="402" fill="#6C789B">answered from sources</text>
      </g>
    </g>

    <text x="56" y="432" class="mono" font-size="16" fill="#6C789B">B.Sc. Computer Science, HIT, GPA 95</text>
  </g>
</svg>
