<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="Job Hunter: searches four Israeli job boards at once and ranks listings by fit with an LLM that has to quote the listing word for word.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1022"/><stop offset="1" stop-color="#101833"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CD6E0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5CD6E0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#5CD6E0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="248" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-500px) } 60%,100% { transform: translateX(1400px) } }
      .chk { stroke-dasharray: 30; stroke-dashoffset: 30; animation: chk 3.2s ease-out infinite; }
      @keyframes chk { 0%,55% { stroke-dashoffset: 30 } 75%,100% { stroke-dashoffset: 0 } }
      .live { animation: live 2s ease-in-out infinite; }
      @keyframes live { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
      @media (prefers-reduced-motion: reduce) { .sweep, .live { animation: none } .chk { animation: none; stroke-dashoffset: 0 } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="250" fill="url(#bg)"/>
    <rect class="sweep" x="0" y="0" width="420" height="250" fill="url(#sweep)"/>
  </g>
  <rect x="1" y="1" width="1278" height="248" rx="18" fill="none" stroke="#26315A" stroke-width="1.5"/>
  <rect x="1" y="40" width="3" height="170" rx="1.5" fill="#FFB547"/>

  <!-- score column -->
  <text x="48" y="78" class="mono" font-size="30" fill="#FFB547">0.93</text>
  <rect x="48" y="92" width="70" height="3" rx="1.5" fill="#1E2748"/>
  <rect x="48" y="92" width="65" height="3" rx="1.5" fill="#FFB547"/>
  <text x="48" y="124" class="mono" font-size="15" fill="#7A86A8">personal</text>
  <text x="48" y="142" class="mono" font-size="15" fill="#7A86A8">project</text>

  <!-- body -->
  <text x="176" y="74" class="sans" font-size="36" font-weight="800" fill="#F2F4FA" letter-spacing="-1">Job Hunter</text>
  <text x="176" y="112" class="sans" font-size="19" fill="#C9D1E4">One search across <tspan fill="#5CD6E0">AllJobs, Drushim, LinkedIn and Indeed</tspan>,</text>
  <text x="176" y="138" class="sans" font-size="19" fill="#C9D1E4">ranked by fit. Every match has to <tspan fill="#5CD6E0">quote the listing</tspan></text>
  <text x="176" y="164" class="sans" font-size="19" fill="#C9D1E4">word for word, or it gets dropped.</text>
  <text xml:space="preserve" x="176" y="208" class="mono" font-size="15" fill="#8995B6">Next.js   TypeScript   PostgreSQL   Drizzle   OpenRouter</text>
  <circle class="live" cx="752" cy="203" r="5" fill="#6EE7A0"/>
  <text x="766" y="208" class="sans" font-size="15" font-weight="600" fill="#6EE7A0">live</text>

  <!-- four boards flowing into one ranked list -->
  <g class="mono" font-size="12" fill="#9AA5C4">
    <rect x="790" y="54" width="90" height="24" rx="6" fill="#0D1326" stroke="#26315A"/><text x="806" y="70">AllJobs</text>
    <rect x="790" y="94" width="90" height="24" rx="6" fill="#0D1326" stroke="#26315A"/><text x="806" y="110">Drushim</text>
    <rect x="790" y="134" width="90" height="24" rx="6" fill="#0D1326" stroke="#26315A"/><text x="806" y="150">LinkedIn</text>
    <rect x="790" y="174" width="90" height="24" rx="6" fill="#0D1326" stroke="#26315A"/><text x="806" y="190">Indeed</text>
  </g>
  <g fill="none" stroke="#26315A" stroke-width="1.5">
    <path d="M880 66 C960 66 960 125 1040 125"/><path d="M880 106 C960 106 960 125 1040 125"/>
    <path d="M880 146 C960 146 960 125 1040 125"/><path d="M880 186 C960 186 960 125 1040 125"/>
  </g>
  <g fill="#5CD6E0">
    <circle r="3.5" opacity="0"><animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite" path="M880 66 C960 66 960 125 1040 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle r="3.5" opacity="0"><animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M880 106 C960 106 960 125 1040 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="3.5" opacity="0"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M880 146 C960 146 960 125 1040 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle r="3.5" opacity="0"><animateMotion dur="3.2s" begin="2.4000000000000004s" repeatCount="indefinite" path="M880 186 C960 186 960 125 1040 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="2.4000000000000004s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1040" y="85" width="190" height="80" rx="10" fill="#0D1326" stroke="#5CD6E0" stroke-opacity=".6"/>
  <g class="mono" font-size="12">
    <rect x="1056" y="101" width="110" height="6" rx="3" fill="#26315A"/><rect x="1056" y="101" width="96" height="6" rx="3" fill="#FFB547"/>
    <rect x="1056" y="121" width="110" height="6" rx="3" fill="#26315A"/><rect x="1056" y="121" width="74" height="6" rx="3" fill="#FFB547" fill-opacity=".75"/>
    <rect x="1056" y="141" width="110" height="6" rx="3" fill="#26315A"/><rect x="1056" y="141" width="48" height="6" rx="3" fill="#FFB547" fill-opacity=".5"/>
  </g>
  <path class="chk" d="M1186 125 l8 8 l16 -18" fill="none" stroke="#6EE7A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
