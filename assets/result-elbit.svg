<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="HD Manager and the AI incident platform at Elbit: a real-time CRM in production, and the RAG pipeline built on top of it.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1022"/><stop offset="1" stop-color="#101833"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB547" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="248" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sweep { animation: sweep 7s ease-in-out infinite; animation-delay: 2.5s; transform: translateX(-500px); }
      @keyframes sweep { 0% { transform: translateX(-500px) } 60%,100% { transform: translateX(1400px) } }
      .node { animation: node 6s infinite; }
      .n2 { animation-delay: 1s } .n3 { animation-delay: 2s } .n4 { animation-delay: 3s } .n5 { animation-delay: 4s } .n6 { animation-delay: 5s }
      @keyframes node { 0%,15% { fill: #FFB547; stroke: #FFB547 } 18%,100% { fill: #0D1326; stroke: #5CD6E0 } }
      .lbl { animation: lbl 6s infinite; }
      .l2 { animation-delay: 1s } .l3 { animation-delay: 2s } .l4 { animation-delay: 3s } .l5 { animation-delay: 4s } .l6 { animation-delay: 5s }
      @keyframes lbl { 0%,15% { fill: #F2F4FA } 18%,100% { fill: #5A668A } }
      @media (prefers-reduced-motion: reduce) { .sweep, .node, .lbl { animation: none } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="250" fill="url(#bg)"/>
    <rect class="sweep" x="0" y="0" width="420" height="250" fill="url(#sweep)"/>
  </g>
  <rect x="1" y="1" width="1278" height="248" rx="18" fill="none" stroke="#26315A" stroke-width="1.5"/>
  <rect x="1" y="40" width="3" height="170" rx="1.5" fill="#5CD6E0"/>

  <!-- score column -->
  <text x="48" y="78" class="mono" font-size="30" fill="#FFB547">0.91</text>
  <rect x="48" y="92" width="70" height="3" rx="1.5" fill="#1E2748"/>
  <rect x="48" y="92" width="64" height="3" rx="1.5" fill="#FFB547"/>
  <text x="48" y="124" class="mono" font-size="15" fill="#7A86A8">Elbit</text>
  <text x="48" y="142" class="mono" font-size="15" fill="#7A86A8">Systems</text>

  <!-- body -->
  <text x="176" y="74" class="sans" font-size="36" font-weight="800" fill="#F2F4FA" letter-spacing="-1">HD Manager + AI platform</text>
  <text x="176" y="112" class="sans" font-size="19" fill="#C9D1E4">A <tspan fill="#5CD6E0">real-time CRM</tspan> for my support team, in production.</text>
  <text x="176" y="138" class="sans" font-size="19" fill="#C9D1E4">An AI incident platform was built on top of it, and I</text>
  <text x="176" y="164" class="sans" font-size="19" fill="#C9D1E4">wrote its <tspan fill="#5CD6E0">RAG pipeline</tspan> with a colleague.</text>
  <text xml:space="preserve" x="176" y="208" class="mono" font-size="15" fill="#8995B6">Python   Flask   React   MongoDB   WebSockets   Docker</text>
  <text x="700" y="206" class="sans" font-size="14" font-weight="600" fill="#5A668A">internal code</text>

  <!-- the pipeline, one stage lit at a time -->
  <g transform="translate(800 0)">
    <path d="M30 125 H400" stroke="#26315A" stroke-width="2"/>
    <g stroke-width="2.5">
      <circle class="node" cx="30" cy="125" r="11" fill="#0D1326" stroke="#5CD6E0"/>
      <circle class="node n2" cx="104" cy="125" r="11" fill="#0D1326" stroke="#5CD6E0"/>
      <circle class="node n3" cx="178" cy="125" r="11" fill="#0D1326" stroke="#5CD6E0"/>
      <circle class="node n4" cx="252" cy="125" r="11" fill="#0D1326" stroke="#5CD6E0"/>
      <circle class="node n5" cx="326" cy="125" r="11" fill="#0D1326" stroke="#5CD6E0"/>
      <circle class="node n6" cx="400" cy="125" r="11" fill="#0D1326" stroke="#5CD6E0"/>
    </g>
    <g class="mono" font-size="13" text-anchor="middle" fill="#5A668A">
      <text class="lbl" x="30" y="96">chunk</text>
      <text class="lbl l2" x="104" y="164">context</text>
      <text class="lbl l3" x="178" y="96">embed</text>
      <text class="lbl l4" x="252" y="164">top-k</text>
      <text class="lbl l5" x="326" y="96">rerank</text>
      <text class="lbl l6" x="400" y="164">answer</text>
    </g>
  </g>
</svg>
